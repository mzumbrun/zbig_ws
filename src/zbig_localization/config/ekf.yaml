ekf_filter_node:
    ros__parameters:
      frequency: 30.0

      two_d_mode: true
      publish_acceleration: true
      publish_tf: true

      map_frame: map             
      odom_frame: odom          
      base_link_frame: base_footprint   
      world_frame: odom          

      odom0: zbig_controller/odom
      odom0_differential: true
      odom0_pose_use_child_frame: false

        #        [x_pos   , y_pos    , z_pos,
        #         roll    , pitch    , yaw,
        #         x_vel   , y_vel    , z_vel,
        #         roll_vel, pitch_vel, yaw_vel,
        #         x_accel , y_accel  , z_accel]

      odom0_config: [false, false, false,
                      false, false, false,
                      true, true, false, 
                      false, false, false,
                      false, false, false]

      imu0: imu/out
      imu0_differential: true
      imu0_pose_use_child_frame: false

        #        [x_pos   , y_pos    , z_pos,
        #         roll    , pitch    , yaw,
        #         x_vel   , y_vel    , z_vel,
        #         roll_vel, pitch_vel, yaw_vel,
        #         x_accel , y_accel  , z_accel]

      imu0_config: [false, false, false, 
                    false, false, true, 
                    false, false, false,
                    false, false, true, 
                    true, false, false]

